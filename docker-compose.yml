# Local stack: Postgres warehouse, MinIO (S3) landing zone, the pipeline, Airflow and Grafana.
#   docker compose up -d db minio minio-init
#   docker compose run --rm pipeline python -m fdp.pipeline generate
#   docker compose run --rm pipeline              # load -> dbt build -> report
#   docker compose up -d grafana airflow           # http://localhost:3000, http://localhost:8080
x-fdp-env: &fdp-env
  FDP_PG_DSN: postgresql://fdp:fdp@db:5432/fdp
  FDP_PG_HOST: db
  FDP_LANDING_URI: s3://landing/freight
  FDP_S3_ENDPOINT: http://minio:9000
  AWS_ACCESS_KEY_ID: minio
  AWS_SECRET_ACCESS_KEY: minio-secret
  AWS_DEFAULT_REGION: us-east-1
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: fdp, POSTGRES_PASSWORD: fdp, POSTGRES_DB: fdp }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U fdp"], interval: 5s, retries: 10 }

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment: { MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: minio-secret }
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: ["sh", "-c", "sleep 3 && mc alias set local http://minio:9000 minio minio-secret && mc mb -p local/landing"]

  pipeline:
    build: .
    environment: *fdp-env
    depends_on: { db: { condition: service_healthy } }

  airflow:
    image: apache/airflow:2.10.5-python3.12
    command: standalone
    environment:
      <<: *fdp-env
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # Fine for a local demo; bake requirements into an image for anything real.
      _PIP_ADDITIONAL_REQUIREMENTS: "psycopg[binary] dbt-core==1.11.* dbt-postgres boto3 sqlglot anthropic"
    volumes:
      - ./dags:/opt/airflow/dags
      - .:/opt/freight-data-platform
    ports: ["8080:8080"]
    depends_on: { db: { condition: service_healthy } }

  grafana:
    image: grafana/grafana:11.4.0
    volumes: ["./grafana/provisioning:/etc/grafana/provisioning"]
    ports: ["3000:3000"]
    depends_on: [db]

volumes:
  pgdata:
  minio:
